<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1116"><title>RupeeVault</title>
<style>
:root{--bg:#0e1116;--s:#171b22;--s2:#1f242d;--tx:#e8eaed;--mu:#8b93a1;--ac:#5eead4;--rd:#f87171;--am:#fbbf24;--bd:#2a303a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:auto;padding:14px}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.c{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:32px;font-weight:700}.mu{color:var(--mu);font-size:13px}.g{color:var(--ac)}.b{color:var(--rd)}.w{color:var(--am)}
button{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit}button.p{background:var(--ac);color:#06201c;border:0;font-weight:600}
input,select{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);padding:14px 0}nav .on{color:var(--ac)}
.bar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}#m>div{background:var(--s);width:100%;max-width:640px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}label{font-size:13px;color:var(--mu)}.row2{display:flex;gap:8px}
</style></head><body><main id="v"></main><nav id="n"></nav><div id="m"><div id="mb"></div></div>
<script>
// ---- Storage: all amounts are integer paise. Ledger (tx) is the single source of truth; balances are derived.
const K='rupeevault.v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{acc:[],par:[],tx:[],wish:[],rec:[],ast:[],nw:[],cool:7};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=x=>Math.round(parseFloat(x||0)*100)||0;
const F=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10),mk=d=>(d||today()).slice(0,7);
const $=s=>document.querySelector(s);
// ---- Accounting rules
// inc: acct+ | sp: acct-, part- | rf: acct+, part+ | tr: acct a -> acct b | al: part+ (virtual, no account effect)
// pt: part a -> part b | ad: acct adjustment (reconciliation, signed) | Unallocated = sum(accounts) - sum(partitions)
function aBal(a){let b=a.open||0;for(const t of S.tx){if(t.a==a.id){if(t.t=='inc'||t.t=='rf'||t.t=='ad')b+=t.amt;if(t.t=='sp'||t.t=='tr')b-=t.amt}if(t.t=='tr'&&t.b==a.id)b+=t.amt}return b}
function pBal(p){let b=0;for(const t of S.tx){if(t.p==p.id){if(t.t=='al'||t.t=='rf')b+=t.amt;if(t.t=='sp')b-=t.amt;if(t.t=='pt')b-=t.amt}if(t.t=='pt'&&t.q==p.id)b+=t.amt}return b}
const cash=()=>S.acc.reduce((s,a)=>s+aBal(a),0),alloc=()=>S.par.reduce((s,p)=>s+pBal(p),0),unal=()=>cash()-alloc();
const due=p=>S.rec.filter(r=>r.p==p.id&&r.last!=mk()).reduce((s,r)=>s+r.amt,0);
const avail=p=>pBal(p)-due(p);
function plan(inc){const ps=S.par.filter(p=>!p.arch);let left=inc,out=[];
 for(const p of ps.filter(p=>p.mode=='fix')){const x=Math.min(p.val,left);if(x>0){out.push([p,x]);left-=x}}
 for(const p of ps.filter(p=>p.mode=='pct')){const x=Math.min(Math.floor(inc*p.val/10000),left);if(x>0){out.push([p,x]);left-=x}}
 return{out,rest:left}}
// ---- UI helpers
function modal(h,fields,ok,label='Save'){let x='<h3 style="margin-top:0">'+h+'</h3>';for(const f of fields){x+='<label>'+f[1]+'</label>'+(f[2]=='sel'?'<select id="f_'+f[0]+'">'+f[3].map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select>':'<input id="f_'+f[0]+'" type="'+(f[2]||'text')+'" '+(f[2]=='number'?'step="any" inputmode="decimal"':'')+' value="'+(f[3]??'')+'">')}
 x+='<div class="row2"><button onclick="cl()" style="flex:1">Cancel</button><button class="p" id="ok" style="flex:2">'+label+'</button></div>';$('#mb').innerHTML=x;$('#m').style.display='flex';
 $('#ok').onclick=()=>{const v={};fields.forEach(f=>v[f[0]]=$('#f_'+f[0]).value);if(ok(v)!==false)cl()}}
const cl=()=>{$('#m').style.display='none'},sync=()=>{save();go(T)};
const aOpt=()=>S.acc.map(a=>[a.id,a.name]),pOpt=()=>S.par.filter(p=>!p.arch).map(p=>[p.id,p.name]);
const need=(c,m)=>{if(!c)alert(m);return c};
const bar=(a,b)=>'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,b?a*100/b:0))+'%"></i></div>';
// Rule rebalance: targets are computed on money you actually hold (all account balances). Percent => % of total cash; fixed => that amount.
const tgt=(p,pool)=>p.mode=='pct'?Math.floor(pool*p.val/10000):p.val;
function rebal(list){const pool=Math.max(0,cash());let u=unal();const ch=[];
 for(const p of list){const d=tgt(p,pool)-pBal(p);if(d<0){ch.push([p,d]);u-=d}}
 for(const p of list){const d=tgt(p,pool)-pBal(p);if(d>0){const x=Math.min(d,Math.max(0,u));if(x>0){ch.push([p,x]);u-=x}}}
 return ch}
function doRb(list){const ch=rebal(list);if(!ch.length)return alert('Nothing to rebalance — partitions already match their rules (or no unallocated money is available).');
 if(!confirm('Apply rules to current balances?\n\n'+ch.map(([p,x])=>p.name+': '+(x>0?'+':'')+F(x)).join('\n')+'\n\nNegative = released back to Unallocated. Unallocated after: '+F(unal()-ch.reduce((s,c)=>s+c[1],0))))return;
 ch.forEach(([p,x])=>S.tx.push({id:id(),d:today(),t:'al',p:p.id,amt:x,n:'Rule rebalance'}));sync()}
const rbAll=()=>doRb(S.par.filter(p=>!p.arch));
// ---- Actions
function addAcc(){modal('New account',[['n','Name'],['o','Opening balance (₹)','number',0]],v=>{if(!need(v.n,'Name required'))return false;S.acc.push({id:id(),name:v.n,open:P(v.o)});sync()})}
function addIncome(){if(!need(S.acc.length,'Add an account first'))return;let f=[['a','Into account','sel',aOpt()],['amt','Amount (₹)','number'],['n','Source (salary, bonus…)','text','Salary'],['d','Date','date',today()]];
 modal('Record income',f,v=>{const m=P(v.amt);if(!need(m>0,'Enter amount'))return false;const pl=plan(m);
  const txt=pl.out.map(([p,x])=>p.name+': '+F(x)).join('\n')+'\nUnallocated: '+F(pl.rest)+'\n\nConfirm allocation?';if(!confirm(txt))return false;
  const g=id();S.tx.push({id:g,d:v.d,t:'inc',a:v.a,amt:m,n:v.n});pl.out.forEach(([p,x])=>S.tx.push({id:id(),d:v.d,t:'al',p:p.id,amt:x,n:'Auto: '+v.n,g}));sync()},'Preview & confirm')}
function addPart(p){const e=p||{};modal(p?'Edit partition':'New partition',[['n','Name','text',e.name||''],['m','Rule','sel',[['pct','% of income'],['fix','Fixed ₹ per income']]],['v','Value (% or ₹)','number',e.val?(e.mode=='pct'?e.val/100:e.val/100):''],['s','Overspend','sel',[['0','Flexible (warn + override)'],['1','Strict (block)']]],['t','Goal target ₹ (optional)','number',e.target?e.target/100:'']],v=>{
  if(!need(v.n,'Name required'))return false;const pc=S.par.filter(x=>!x.arch&&x.mode=='pct'&&x!==p).reduce((s,x)=>s+x.val,0)+(v.m=='pct'?P(v.v):0);
  if(!need(pc<=10000,'Percent rules exceed 100% — money would be allocated twice'))return false;
  const o={name:v.n,mode:v.m,val:v.m=='pct'?Math.round(parseFloat(v.v||0)*100):P(v.v),strict:v.s=='1',target:P(v.t)};
  let q=p;if(p)Object.assign(p,o);else{q={id:id(),...o};S.par.push(q)}
  doRb([q]);sync()});if(p){$('#f_m').value=p.mode;$('#f_s').value=p.strict?1:0}}
function spend(pid){if(!need(S.acc.length&&S.par.length,'Add an account and a partition first'))return;
 modal('Expense',[['p','Partition','sel',pOpt()],['a','Paid from','sel',aOpt()],['amt','Amount (₹)','number'],['n','Note'],['d','Date','date',today()]],v=>{
  const m=P(v.amt),p=S.par.find(x=>x.id==v.p);if(!need(m>0,'Enter amount'))return false;const av=avail(p);
  if(m>av){if(p.strict){alert('Strict partition: '+F(av)+' available, '+F(m)+' needed. Blocked.');return false}if(!confirm('Over budget by '+F(m-av)+' (available after upcoming bills: '+F(av)+'). Override?'))return false}
  S.tx.push({id:id(),d:v.d,t:'sp',a:v.a,p:v.p,amt:m,n:v.n});sync()},'Confirm purchase');if(pid)$('#f_p').value=pid;
 const chk=document.createElement('div');chk.className='mu';chk.id='chk';$('#mb').prepend(chk);const u=()=>{const p=S.par.find(x=>x.id==$('#f_p').value),m=P($('#f_amt').value);chk.innerHTML='Affordability check (deducts nothing): available '+F(avail(p))+(m?(m>avail(p)?' — <span class=b>short by '+F(m-avail(p))+'</span>':' — <span class=g>OK</span>'):'')};$('#mb').oninput=u;u()}
function refund(){modal('Refund',[['p','Partition','sel',pOpt()],['a','Into account','sel',aOpt()],['amt','Amount (₹)','number'],['n','Note']],v=>{if(!need(P(v.amt)>0,'Enter amount'))return false;S.tx.push({id:id(),d:today(),t:'rf',a:v.a,p:v.p,amt:P(v.amt),n:'Refund '+v.n});sync()})}
function xfer(){if(!need(S.acc.length>1,'Need two accounts'))return;modal('Transfer between accounts',[['a','From','sel',aOpt()],['b','To','sel',aOpt()],['amt','Amount (₹)','number']],v=>{if(!need(v.a!=v.b&&P(v.amt)>0,'Pick two different accounts and an amount'))return false;S.tx.push({id:id(),d:today(),t:'tr',a:v.a,b:v.b,amt:P(v.amt),n:'Transfer'});sync()})}
function move(){if(!need(S.par.length>1,'Need two partitions'))return;modal('Move virtual money',[['p','From','sel',pOpt()],['q','To','sel',pOpt()],['amt','Amount (₹)','number']],v=>{const m=P(v.amt);if(!need(v.p!=v.q&&m>0,'Invalid'))return false;if(!need(m<=pBal(S.par.find(x=>x.id==v.p)),'Insufficient partition balance'))return false;S.tx.push({id:id(),d:today(),t:'pt',p:v.p,q:v.q,amt:m,n:'Move'});sync()})}
function recon(a){modal('Reconcile '+a.name,[['b','Actual balance in bank/cash (₹)','number',aBal(a)/100]],v=>{const d=P(v.b)-aBal(a);if(!d)return;if(!confirm('Difference '+F(d)+'. Record adjustment entry?'))return false;S.tx.push({id:id(),d:today(),t:'ad',a:a.id,amt:d,n:'Reconciliation'});sync()})}
function addWish(){modal('Wishlist item',[['n','Item'],['c','Expected cost ₹','number'],['p','Partition (saving for it)','sel',[['','—'],...pOpt()]],['pr','Priority','sel',[['1','High'],['2','Medium'],['3','Low']]],['d','Target date','date']],v=>{if(!need(v.n&&P(v.c),'Name and cost required'))return false;S.wish.push({id:id(),name:v.n,cost:P(v.c),p:v.p,pri:+v.pr,date:v.d,added:today()});sync()})}
function addRec(){if(!need(S.par.length&&S.acc.length,'Add account and partition first'))return;modal('Recurring bill',[['n','Name'],['amt','Amount ₹','number'],['p','Partition','sel',pOpt()],['a','Paid from','sel',aOpt()],['d','Day of month','number',1]],v=>{if(!need(v.n&&P(v.amt),'Name and amount required'))return false;S.rec.push({id:id(),name:v.n,amt:P(v.amt),p:v.p,a:v.a,day:+v.d||1,last:''});sync()})}
function payRec(r){if(r.last==mk())return alert('Already paid this month');if(!confirm('Record '+F(r.amt)+' for '+r.name+'?'))return;S.tx.push({id:id(),d:today(),t:'sp',a:r.a,p:r.p,amt:r.amt,n:r.name+' (recurring)'});r.last=mk();sync()}
function addAst(l){modal(l?'Liability':'Asset / investment',[['n','Name'],['t','Type','sel',(l?['Loan','Credit card','Other']:['Mutual fund','ETF','Stock','EPF','Fixed deposit','Gold','Other']).map(x=>[x,x])],['c','Invested / principal ₹','number'],['v','Current value ₹','number']],v=>{if(!need(v.n,'Name required'))return false;S.ast.push({id:id(),name:v.n,type:v.t,liab:!!l,cost:P(v.c),val:P(v.v||v.c)});sync()})}
function updAst(a){modal('Update '+a.name,[['v','Current value ₹','number',a.val/100],['c','Add contribution ₹ (optional)','number']],v=>{a.val=P(v.v);a.cost+=P(v.c);sync()})}
const snap=()=>{const m=mk(),a=S.ast.filter(x=>!x.liab).reduce((s,x)=>s+x.val,0),l=S.ast.filter(x=>x.liab).reduce((s,x)=>s+x.val,0),v=cash()+a-l;const e=S.nw.find(x=>x.m==m);e?e.v=v:S.nw.push({m,v})};
function backup(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rupeevault-'+today()+'.json';a.click()}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!d.tx||!d.acc)throw 0;if(confirm('Replace ALL current data with backup?')){S=d;sync()}}catch(e){alert('Invalid backup file')}});i.click()}
function csv(){let r='date,type,account,partition,amount,note\n';const an=i=>S.acc.find(a=>a.id==i)?.name||'',pn=i=>S.par.find(a=>a.id==i)?.name||'';S.tx.forEach(t=>r+=[t.d,t.t,an(t.a),pn(t.p),t.amt/100,'"'+(t.n||'').replace(/"/g,'""')+'"'].join(',')+'\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/csv'}));a.download='rupeevault.csv';a.click()}
function sim(){modal('What-if simulator (no data changed)',[['s','Monthly salary ₹','number',100000],['r','Annual raise %','number',8],['p','% of salary saved','number',30],['y','Years','number',10],['g','Expected return % /yr','number',10],['i','Inflation % /yr','number',6]],v=>{let s=+v.s,p=+v.p/100,y=+v.y,g=+v.g/100/12,i=+v.i/100,c=0,inv=0;for(let m=0;m<y*12;m++){if(m&&m%12==0)s*=1+ +v.r/100;c=c*(1+g)+s*p;inv+=s*p}const real=c/Math.pow(1+i,y);
  alert('Assumptions (not guarantees):\nContributed: ₹'+Math.round(inv).toLocaleString('en-IN')+'\nProjected value: ₹'+Math.round(c).toLocaleString('en-IN')+'\nIn today\'s purchasing power: ₹'+Math.round(real).toLocaleString('en-IN'));return false},'Simulate')}
function eta(p){const rate=S.tx.filter(t=>t.p==p.id&&t.t=='al'&&t.d>=new Date(Date.now()-90*864e5).toISOString().slice(0,10)).reduce((s,t)=>s+t.amt,0)/3;const left=p.target-pBal(p);if(left<=0)return'Goal reached';if(rate<=0)return'No recent contributions';const d=new Date();d.setMonth(d.getMonth()+Math.ceil(left/rate));return'Est. '+d.toLocaleDateString('en-IN',{month:'short',year:'numeric'})+' at ~'+F(rate)+'/mo (excl. inflation)'}
// ---- Views
let T='home';const tabs=[['home','Home'],['plan','Partitions'],['acc','Accounts'],['hist','Ledger'],['more','More']];
const V={
home(){snap();const a=S.ast.filter(x=>!x.liab).reduce((s,x)=>s+x.val,0),l=S.ast.filter(x=>x.liab).reduce((s,x)=>s+x.val,0),u=unal(),m=mk();
 const inc=S.tx.filter(t=>t.t=='inc'&&mk(t.d)==m).reduce((s,t)=>s+t.amt,0),ex=S.tx.filter(t=>t.t=='sp'&&mk(t.d)==m).reduce((s,t)=>s+t.amt,0);
 let h='<div class="c"><div class="mu">Net worth</div><div class="big">'+F(cash()+a-l)+'</div><div class="mu">Cash & bank '+F(cash())+' · Investments/assets '+F(a)+' · Liabilities '+F(l)+'</div></div>'+
 '<div class="row2"><button class="p" style="flex:1" onclick="addIncome()">+ Income</button><button class="p" style="flex:1" onclick="spend()">− Expense</button></div>'+
 '<h2>This month</h2><div class="c r"><span>Income</span><b>'+F(inc)+'</b></div><div class="c r"><span>Spent</span><b>'+F(ex)+'</b></div><div class="c r"><span>Savings rate</span><b class="g">'+(inc?Math.round((inc-ex)*100/inc)+'%':'—')+'</b></div>'+
 '<h2>Money map</h2><div class="c r"><span>In partitions</span><b>'+F(alloc())+'</b></div><div class="c r"><span>Unallocated</span><b class="'+(u<0?'b':'w')+'">'+F(u)+'</b></div>'+(u<0?'<div class="mu b">Partitions hold more than your accounts do — reconcile or fix an entry.</div>':'');
 const up=S.rec.filter(r=>r.last!=m);if(up.length)h+='<h2>Upcoming bills</h2>'+up.map(r=>'<div class="c r"><span>'+r.name+' <span class="mu">day '+r.day+'</span></span><b>'+F(r.amt)+'</b></div>').join('');
 if(S.nw.length>1)h+='<h2>Net worth history</h2>'+S.nw.slice(-6).map(x=>'<div class="r mu"><span>'+x.m+'</span><span>'+F(x.v)+'</span></div>').join('');
 if(!S.acc.length)h='<div class="c"><b>Welcome to RupeeVault</b><p class="mu">1) Add an account (Accounts tab) 2) Create partitions with allocation rules 3) Record income — it auto-splits into partitions.</p><button class="p" onclick="addAcc()">Add first account</button></div>'+h;return h},
plan(){let h='<div class="row2"><button class="p" style="flex:1" onclick="addPart()">+ Partition</button><button style="flex:1" onclick="move()">Move ₹</button><button style="flex:1" onclick="rbAll()">Rebalance</button></div>';const pc=S.par.filter(p=>!p.arch&&p.mode=='pct').reduce((s,p)=>s+p.val,0);h+='<div class="mu" style="margin-top:8px">Percent rules total '+pc/100+'% · remainder stays unallocated</div>';
 S.par.forEach(p=>{const b=pBal(p);h+='<div class="c" style="opacity:'+(p.arch?.5:1)+'"><div class="r"><b>'+p.name+(p.target?' 🎯':'')+'</b><b class="'+(b<0?'b':'g')+'">'+F(b)+'</b></div><div class="mu">'+(p.mode=='pct'?p.val/100+'%':F(p.val))+' · '+(p.strict?'Strict':'Flexible')+(due(p)?' · bills due '+F(due(p)):'')+' · available '+F(avail(p))+'</div>'+
  (p.target?bar(b,p.target)+'<div class="mu">'+F(b)+' of '+F(p.target)+' · '+F(Math.max(0,p.target-b))+' left · '+eta(p)+'</div>':'')+'<div class="row2" style="margin-top:8px"><button onclick="spend(\''+p.id+'\')">Spend</button><button onclick="addPart(S.par.find(x=>x.id==\''+p.id+'\'))">Edit</button><button onclick="arch(\''+p.id+'\')">'+(p.arch?'Restore':'Archive')+'</button></div></div>'});return h},
acc(){let h='<div class="row2"><button class="p" style="flex:1" onclick="addAcc()">+ Account</button><button style="flex:1" onclick="xfer()">Transfer</button><button style="flex:1" onclick="refund()">Refund</button></div><h2>Accounts</h2>';S.acc.forEach(a=>h+='<div class="c r"><div><b>'+a.name+'</b></div><div><b>'+F(aBal(a))+'</b> <button onclick="recon(S.acc.find(x=>x.id==\''+a.id+'\'))">Reconcile</button></div></div>');return h},
hist(){let h='';[...S.tx].reverse().slice(0,150).forEach(t=>{const p=S.par.find(x=>x.id==t.p),a=S.acc.find(x=>x.id==t.a),sg=['inc','rf','al'].includes(t.t)?'+':t.t=='sp'?'−':'';h+='<div class="c r"><div><b>'+(t.n||t.t)+'</b><div class="mu">'+t.d+' · '+t.t.toUpperCase()+' · '+(p?p.name:'')+(p&&a?' / ':'')+(a?a.name:'')+'</div></div><b class="'+(t.t=='sp'?'b':t.t=='al'?'mu':'g')+'">'+sg+F(t.amt)+'</b></div>'});return h||'<div class="mu">No transactions yet.</div>'},
more(){let h='<h2>Wishlist</h2><button onclick="addWish()">+ Wish</button>';[...S.wish].sort((a,b)=>a.pri-b.pri).forEach(w=>{const p=S.par.find(x=>x.id==w.p),sv=p?Math.max(0,pBal(p)):0,days=Math.ceil((Date.now()-new Date(w.added))/864e5),cool=S.cool-days;
  h+='<div class="c"><div class="r"><b>'+w.name+'</b><span>'+F(w.cost)+'</span></div>'+bar(sv,w.cost)+'<div class="mu">'+['','High','Medium','Low'][w.pri]+' priority'+(p?' · saved '+F(sv)+' in '+p.name:'')+(w.date?' · by '+w.date:'')+(cool>0?' · <span class=w>cooling-off '+cool+'d left</span>':' · cooling-off done')+'</div><button onclick="S.wish=S.wish.filter(x=>x.id!=\''+w.id+'\');sync()">Remove</button></div>'});
 h+='<h2>Recurring bills</h2><button onclick="addRec()">+ Bill</button>';S.rec.forEach(r=>h+='<div class="c r"><div><b>'+r.name+'</b><div class="mu">'+F(r.amt)+' · monthly day '+r.day+' · '+(r.last==mk()?'paid this month':'due')+'</div></div><div><button onclick="payRec(S.rec.find(x=>x.id==\''+r.id+'\'))">Pay</button> <button onclick="S.rec=S.rec.filter(x=>x.id!=\''+r.id+'\');sync()">✕</button></div></div>');
 h+='<h2>Investments & assets</h2><div class="row2"><button onclick="addAst()">+ Asset</button><button onclick="addAst(1)">+ Liability</button></div>';S.ast.forEach(a=>h+='<div class="c r"><div><b>'+a.name+'</b><div class="mu">'+a.type+(a.liab?'':' · invested '+F(a.cost)+' · '+(a.cost?Math.round((a.val-a.cost)*100/a.cost)+'%':''))+'</div></div><div><b class="'+(a.liab?'b':'')+'">'+F(a.val)+'</b> <button onclick="updAst(S.ast.find(x=>x.id==\''+a.id+'\'))">Edit</button></div></div>');
 h+='<h2>Tools & data</h2><div class="row2"><button onclick="sim()">What-if</button><button onclick="backup()">Backup</button><button onclick="restore()">Restore</button><button onclick="csv()">CSV</button></div><p class="mu">Data lives only on this device (browser storage). Back up regularly. Reserved ≠ invested: partitions are virtual; assets are tracked separately.</p>';return h}};
function arch(i){const p=S.par.find(x=>x.id==i);p.arch=!p.arch;sync()}
function go(t){T=t;$('#v').innerHTML=V[t]();$('#n').innerHTML=tabs.map(x=>'<button class="'+(x[0]==t?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');window.scrollTo(0,0)}
go('home');
</script></body></html>
